<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amar's Blog</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
    <nav>
        <span class="nav-name">Amar Bagineni</span>
        <span class="nav-dot"></span>
        <span class="nav-label">Notes & Writing</span>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">☀️</button>
    </nav>

    <header>
        <h1>Things I think<br>about and <em>write down.</em></h1>
    </header>

    <main>
        <div id="tag-buttons" class="tag-buttons"></div>
        <div id="filter-container" class="filter-container"></div>
        <div class="list-header">
            <span class="lh-title">Title</span>
            <span class="lh-tag">Topic</span>
            <span class="lh-date">Date</span>
        </div>
        <div id="placeholder-blogs"></div>
    </main>

    <footer>
        <div class="footer-inner">
            <span>&copy; 2026</span>
            <span class="footer-dot"></span>
            <span>Bangalore</span>
        </div>
    </footer>

    <script src="./data.js"></script>
    <script src="./script.js"></script>

    <script>
function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    document.querySelectorAll('.theme-toggle').forEach(btn => {
        btn.textContent = next === 'dark' ? '☀️' : '🌙';
    });
}
(function() {
    const saved = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.theme-toggle').forEach(btn => {
            btn.textContent = saved === 'dark' ? '☀️' : '🌙';
        });
    });
})();
</script>
</body>

</html>
